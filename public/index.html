<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Country Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f0f2f5;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        header {
            background-color: #2c3e50; color: white; width: 100%; padding: 1.5rem; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        main {
            max-width: 800px; width: 100%; padding: 2rem;
        }
        .search-box {
            display: flex; gap: 10px; margin-bottom: 2rem;
        }
        .search-box input {
            flex: 1; padding: 12px; font-size: 1.1rem; border: 1px solid #ccc; border-radius: 6px;
        }
        .search-box button {
            padding: 12px 24px; font-size: 1.1rem; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s;
        }
        .search-box button:hover { background-color: #2980b9; }
        
        #error-message {
            color: #e74c3c; background: #fadbd8; padding: 10px; border-radius: 6px; text-align: center; display: none; margin-bottom: 1rem;
        }

        .dashboard {
            display: none; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr; }
        }
        .card {
            background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .card h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f9f9f9; }
        .data-row:last-child { border-bottom: none; }
        .label { font-weight: bold; color: #7f8c8d; }
        .value { color: #2c3e50; font-weight: 500; }
        
        .flag-container { text-align: center; margin-bottom: 15px; }
        .flag-container img { max-width: 120px; border: 1px solid #ddd; border-radius: 4px; }

        .loader {
            display: none; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%;
            width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>🌍 Global Weather & Country Dashboard</h1>
        <p>A Custom API Aggregator Project</p>
    </header>

    <main>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter a city name (e.g., Tokyo, Paris, New York)..." />
            <button id="searchBtn">Search</button>
        </div>

        <div id="error-message"></div>
        <div class="loader" id="loader"></div>

        <div class="dashboard" id="dashboard">
            <div class="card">
                <h2>🌤️ Weather</h2>
                <div class="data-row"><span class="label">City</span><span class="value" id="val-city"></span></div>
                <div class="data-row"><span class="label">Temperature</span><span class="value" id="val-temp"></span></div>
                <div class="data-row"><span class="label">Wind Speed</span><span class="value" id="val-wind"></span></div>
                <div class="data-row"><span class="label">Coordinates</span><span class="value" id="val-coords"></span></div>
                <div class="data-row"><span class="label">Local Time</span><span class="value" id="val-time"></span></div>
            </div>

            <div class="card">
                <h2>📍 Country Info</h2>
                <div class="flag-container">
                    <img id="val-flag" src="" alt="Country Flag" style="display: none;" />
                </div>
                <div class="data-row"><span class="label">Country</span><span class="value" id="val-country"></span></div>
                <div class="data-row"><span class="label">Region</span><span class="value" id="val-region"></span></div>
                <div class="data-row"><span class="label">Population</span><span class="value" id="val-population"></span></div>
            </div>
        </div>
    </main>

    <script>
        const searchBtn = document.getElementById('searchBtn');
        const cityInput = document.getElementById('cityInput');
        const dashboard = document.getElementById('dashboard');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-message');

        async function fetchDashboardData() {
            const city = cityInput.value.trim();
            if (!city) return;

            // Reset UI
            errorMsg.style.display = 'none';
            dashboard.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/location-info?city=${encodeURIComponent(city)}`);
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    
                    // Populate Weather Data
                    document.getElementById('val-city').innerText = data.city;
                    document.getElementById('val-temp').innerText = `${data.weather.temperature} °C`;
                    document.getElementById('val-wind').innerText = `${data.weather.windspeed} km/h`;
                    document.getElementById('val-coords').innerText = `${data.coordinates.latitude.toFixed(2)}, ${data.coordinates.longitude.toFixed(2)}`;
                    document.getElementById('val-time').innerText = data.weather.time.replace('T', ' ');

                    // Populate Country Data
                    document.getElementById('val-country').innerText = data.country;
                    if (data.countryInfo) {
                        document.getElementById('val-region').innerText = data.countryInfo.region;
                        document.getElementById('val-population').innerText = data.countryInfo.population.toLocaleString();
                        const flagImg = document.getElementById('val-flag');
                        flagImg.src = data.countryInfo.flag;
                        flagImg.style.display = 'inline-block';
                    } else {
                        document.getElementById('val-region').innerText = 'N/A';
                        document.getElementById('val-population').innerText = 'N/A';
                        document.getElementById('val-flag').style.display = 'none';
                    }

                    // Show Dashboard
                    dashboard.style.display = 'grid';
                } else {
                    errorMsg.innerText = result.message || 'Error fetching data.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.innerText = 'Failed to connect to the server.';
                errorMsg.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }

        searchBtn.addEventListener('click', fetchDashboardData);
        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchDashboardData();
        });
    </script>
</body>
</html>
